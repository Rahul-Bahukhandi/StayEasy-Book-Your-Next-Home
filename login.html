<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – StayEasy</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef3f6;
        }

        header {
            background: #2c3e50;
            padding: 12px 24px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 20px;
        }

        .form-container {
            max-width: 420px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #00d4aa;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            background: #00d4aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #01b692;
        }

        .register-link {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
        }

        .register-link a {
            color: #00d4aa;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header>
        <a href="home.html">← Back to Home</a>
    </header>

    <!-- Login Form -->
    <div class="form-container">
        <h2>Login to StayEasy</h2>
        <form>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <div class="register-link">
            Don’t have an account? <a href="register.html">Register</a>
        </div>
    </div>
</body>

</html>
