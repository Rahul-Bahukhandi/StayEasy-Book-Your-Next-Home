<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Hotel – StayEasy</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f9;
        }

        header {
            background: #2c3e50;
            padding: 12px 24px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 20px;
        }

        .form-container {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #00d4aa;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            background: #00d4aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #01b692;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header>
        <a href="home.html">← Back to Home</a>
    </header>

    <!-- Upload Form -->
    <div class="form-container">
        <h2>Upload Hotel</h2>
        <form>
            <div class="form-group">
                <label for="name">Hotel Name</label>
                <input type="text" id="name" name="name" placeholder="Enter hotel name" required>
            </div>
            <div class="form-group">
                <label for="place">Place</label>
                <input type="text" id="place" name="place" placeholder="Enter location" required>
            </div>
            <div class="form-group">
                <label for="price">Price (₹)</label>
                <input type="number" id="price" name="price" placeholder="Enter price" required>
            </div>
            <button type="submit" class="btn">Upload</button>
        </form>
    </div>
</body>

</html>
